name: Release WaifuPics

on:
  workflow_dispatch:
    inputs:
      release_summary:
        description: Optional short summary shown above the generated changelog
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from version catalog
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(awk -F'"' '/^versionName[[:space:]]*=/{print $2; exit}' gradle/libs.versions.toml)"
          VERSION_CODE="$(awk -F'"' '/^versionCode[[:space:]]*=/{print $2; exit}' gradle/libs.versions.toml)"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected versionName in major.minor.patch form, got: $VERSION_NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Expected a positive integer versionCode, got: $VERSION_CODE" >&2
            exit 1
          fi
          VERSION_CODE=$((10#$VERSION_CODE))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2147483647 )); then
            echo "versionCode must be between 1 and 2147483647" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  android:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release APK
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: >-
          ./gradlew :modules:instances:app:assembleRelease
          "-Pversion_name=$RELEASE_VERSION"
          "-Pversion_code=$RELEASE_VERSION_CODE"
          --stacktrace
          --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'

      - name: Sign universal APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: modules/instances/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '37.0.0'

      - name: Prepare Android release asset
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          RELEASE_VERSION: ${{ needs.version.outputs.version_name }}
        run: |
          mkdir -p release-assets
          cp "$SIGNED_APK" "release-assets/WaifuPics-v${RELEASE_VERSION}-android-universal.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/
          if-no-files-found: error

  macos:
    name: Build macOS release package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build macOS release package
        run: >-
          ./gradlew :modules:instances:desktop:packageReleaseDistributionForCurrentOS
          --no-configuration-cache
          --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'

      - name: Prepare macOS release asset
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version_name }}
        run: |
          case "$(uname -m)" in
            arm64|aarch64) MAC_ARCH=arm64 ;;
            x86_64) MAC_ARCH=x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [[ "$MAC_ARCH" != "${{ matrix.arch }}" ]]; then
            echo "Expected ${{ matrix.arch }} runner, got $MAC_ARCH" >&2
            exit 1
          fi
          DMG_FILE="$(find modules/instances/desktop/build/compose/binaries/main-release -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_FILE"
          mkdir -p release-assets
          cp "$DMG_FILE" "release-assets/WaifuPics-v${RELEASE_VERSION}-macos-${MAC_ARCH}.dmg"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-release
          path: release-assets/
          if-no-files-found: error

  windows:
    name: Build Windows release installer
    runs-on: windows-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Windows app image
        shell: bash
        run: >-
          ./gradlew :modules:instances:desktop:createReleaseDistributable
          --no-configuration-cache
          --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Create Windows setup executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version_name }}
        run: |
          $appImage = Get-ChildItem "modules/instances/desktop/build/compose/binaries/main-release/app" -Directory |
            Where-Object { $_.Name -like "WaifuPics*" -and (Test-Path (Join-Path $_.FullName "WaifuPics.exe")) } |
            Select-Object -First 1
          if (-not $appImage) { throw "WaifuPics app image was not generated" }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler is missing: $iscc" }
          & $iscc "/DAppImage=$($appImage.FullName)" "/DAppVersion=$env:RELEASE_VERSION" "/O$PWD/release-assets" "/FWaifuPics-v$env:RELEASE_VERSION-windows-x64.exe" "packaging/windows/WaifuPics.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - android
      - macos
      - windows
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          test -f "release-assets/WaifuPics-v${{ needs.version.outputs.version_name }}-android-universal.apk"
          test -f "release-assets/WaifuPics-v${{ needs.version.outputs.version_name }}-macos-arm64.dmg"
          test -f "release-assets/WaifuPics-v${{ needs.version.outputs.version_name }}-macos-x64.dmg"
          test -f "release-assets/WaifuPics-v${{ needs.version.outputs.version_name }}-windows-x64.exe"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: waifupics-v${{ needs.version.outputs.version_name }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // ""')"
          request_file="$(mktemp)"
          notes_file="$(mktemp)"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg previous "$previous_tag" \
            '{tag_name: $tag, target_commitish: $target} + (if $previous == "" then {} else {previous_tag_name: $previous} end)' \
            > "$request_file"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --input "$request_file" \
            --jq '.body' > "$notes_file"
          if [[ -n "$RELEASE_SUMMARY" ]]; then
            printf '%s\n\n' "$RELEASE_SUMMARY" > release-notes.md
            cat "$notes_file" >> release-notes.md
          else
            cp "$notes_file" release-notes.md
          fi
          cat >> release-notes.md <<'NOTES'

          ### Installation notes

          - **macOS:** The DMG is not signed or notarized because this project does not have an Apple Developer ID. On first launch, macOS may block the app. In Finder, control-click WaifuPics.app, choose **Open**, then confirm **Open**. This is required by macOS Gatekeeper for unsigned apps.
          - **Windows:** The installer is not code-signed. Windows SmartScreen may show an unknown-publisher warning; choose **More info** → **Run anyway** if you trust this release.
          - **Web:** The JavaScript build is at the site root. The WebAssembly build is available in the `/wasm/` subdirectory.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: waifupics-v${{ needs.version.outputs.version_name }}
          name: WaifuPics v${{ needs.version.outputs.version_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
