name: Verify Android release build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  android-release-build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release APK
        run: >-
          ./gradlew :modules:instances:app:assembleRelease
          --stacktrace
          --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'

      - name: Verify universal APK output
        run: test -f modules/instances/app/build/outputs/apk/release/app-release-unsigned.apk
